[project]
name = "hospital-greenops"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi",
 "uvicorn[standard]",
 "sqlalchemy>=2",
 "alembic",
 "psycopg[binary]",
 "pydantic-settings",
 "argon2-cffi",
 "python-multipart",
 "celery[redis]",
 "boto3",
 "azure-storage-blob",
 "openai",
 "httpx",
 "PyYAML",
 "numpy==2.3.5",
 "pandas==2.2.3",
 "scikit-learn==1.8.0",
 "joblib==1.5.3",
 "reportlab>=5.0.1",
]
[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
cache_dir = "/tmp/greenops-pytest-cache"
[tool.ruff]
line-length = 110
